passwordResetSubject=Recuperare parolă
passwordResetBody=Cineva tocmai a solicitat o modificare a acreditărilor contului tău {2}. Dacă ai solicitat acest lucru, fă click pe linkul de mai jos pentru a le reseta.\n\n{0}\n\nAcest link și cod vor expira în {1} minute.\n\nDacă nu dorești să resetezi acreditările, poți ignora acest mesaj. Nu se vor efectua modificări.
passwordResetBodyHtml=<a href="{0}" style="color: #fff; text-decoration: none; cursor:pointer;"><p style="font-family: 'Inter', sans-serif; cursor:pointer;">Fă click aici pentru a reseta parola</p></a>
passwordResetBodyText1Html=<div style="font-family: 'Inter', sans-serif; font-weight: bold; font-size: 20px; line-height: 28px; color: #1F1F1F; margin-top: 24px;">Accesează linkul de resetare a parolei</div>
passwordResetBodyText2Html=<div style="font-family: 'Inter', sans-serif; font-style: normal; font-weight: normal; font-size: 16px; line-height: 24px; color: #707070; margin-top: 24px;">Ai solicitat resetarea parolei. Pentru a continua, fă click pe butonul de mai jos sau copiază și lipește linkul în browser. Vei fi redirecționat către o pagină unde poți crea o nouă parolă. <strong style="">Acest link expiră în {0} minute.</strong></div>
passwordResetBodyText3Html=<div style="margin: 5px auto;font-family: 'Inter', sans-serif;font-style: normal;font-weight: normal;font-size: 12px;line-height: 16px;text-align: center;color: #5C5C5C;width: 385px;height: 32px;">Dacă nu ai solicitat acest lucru, ignoră acest mesaj și schimbă parola e-mailului pentru securitate. Contactează serviciul de asistență dacă este necesar.</div>
