identityProviderLinkSubject=Link {0}
identityProviderLinkBody=Someone wants to link your "{1}" account to the "{0}" account belonging to user {2}. If you requested this, click the link below to link the accounts:\n\n{3}\n\nThis link will expire in {4} minutes.\n\nIf you don't want to link the accounts, you can ignore this message. Once linked, you'll be able to log in to {1} through {0}.
identityProviderLinkBodyHtml=<p>Someone wants to link your <b>{1}</b> account to the <b>{0}</b> account belonging to user {2}. If you requested this, click the link below to link the accounts.</p><p><a href="{3}">Confirm account linking</a></p><p>This link will expire in {4} minutes.</p><p>If you don't want to link the accounts, you can ignore this message. Once linked, you will be able to log in to {1} through {0}.</p>
passwordResetSubject=Password recovery
passwordResetBody=Someone just requested a change to your {2} account credentials. If you requested this, click the link below to reset them.\n\n{0}\n\nThis link and code will expire in {1} minutes.\n\nIf you don't want to reset your credentials, you can ignore this message. No changes will be made.
passwordResetBodyHtml=<a href="{0}" style="color: #fff; text-decoration: none; cursor:pointer;"><p style="font-family: 'Inter', sans-serif; cursor:pointer;">Click here to reset your password</p></a>
passwordResetBodyText1Html=<div style="font-family: 'Inter', sans-serif; font-weight: bold; font-size: 20px; line-height: 28px; color: #1F1F1F; margin-top: 24px;">Access the password reset link</div>
passwordResetBodyText2Html=<div style="font-family: 'Inter', sans-serif; font-style: normal; font-weight: normal; font-size: 16px; line-height: 24px; color: #707070; margin-top: 24px;">You requested to reset your password. To continue, click the button below or copy and paste the link into your browser. You'll be redirected to a page where you can create a new password. <strong style="">This link expires in {0} minutes.</strong></div>
passwordResetBodyText3Html=<div style="margin: 5px auto;font-family: 'Inter', sans-serif;font-style: normal;font-weight: normal;font-size: 12px;line-height: 16px;text-align: center;color: #5C5C5C;width: 385px;height: 32px;">If you didn't request this, ignore this message and change your email password for security. Contact Support if necessary.</div>
